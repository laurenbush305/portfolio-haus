title: Portfolio Haus
description: Strategic communications and messaging for institutions and expert-led founders.
url: "https://portfolio.haus"
baseurl: ""
markdown: kramdown
plugins:
  - jekyll-sitemap
email: biz.portfoliohaus@gmail.com
linkedin: https://www.linkedin.com/in/lauren-bush-305/
# Optional: verified Formspree endpoint, e.g. https://formspree.io/f/FORM_ID.
# Empty means the intake prepares an inquiry locally; nothing is submitted.
intake_endpoint: ""
exclude:
  - README.md
  - LAUNCH-CHECKLIST.md
  - docs
  - tests
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
  - package.json
  - package-lock.json
  - '*.gemspec'
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
