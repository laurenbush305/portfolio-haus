<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>{{ page.title | default: site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.canonical | default: page.url | absolute_url }}">
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="alternate icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#1C1A2E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Portfolio Haus">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.canonical | default: page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Portfolio Haus. Strong work deserves a message that can carry it.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<meta name="twitter:image" content="{{ page.image | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Libre+Baskerville:ital,wght@0,700;1,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% if page.extra_css %}{% for css in page.extra_css %}<link rel="stylesheet" href="{{ css | relative_url }}">{% endfor %}{% endif %}
{% if page.signal %}<link rel="stylesheet" href="{{ '/assets/css/haus-signal.css' | relative_url }}">{% endif %}
<script type="application/ld+json">
{
 "@context":"https://schema.org", "@type":"ProfessionalService",
 "@id":{{ '/#studio' | absolute_url | jsonify }}, "name":"Portfolio Haus",
 "url":{{ '/' | absolute_url | jsonify }}, "description":{{ site.description | jsonify }},
 "image":{{ '/assets/images/og-image.png' | absolute_url | jsonify }},
 "email":{{ site.email | jsonify }}, "areaServed":"US",
 "hasOfferCatalog":{"@type":"OfferCatalog","name":"Portfolio Haus services","itemListElement":[
  {"@type":"Offer","itemOffered":{"@type":"Service","name":"Institutional strategic communications","url":{{ '/institutions/' | absolute_url | jsonify }}}},
  {"@type":"Offer","itemOffered":{"@type":"Service","name":"Founder messaging","url":{{ '/founders/' | absolute_url | jsonify }}}}
 ]},
 "founder":{"@type":"Person","name":"Lauren Bush","jobTitle":"Founder & Principal Strategist","sameAs":[{{ site.linkedin | jsonify }}]},
 "sameAs":[{{ site.linkedin | jsonify }}]
}
</script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body data-contact-url="{{ '/start/' | relative_url }}" data-founders-url="{{ '/founders/' | relative_url }}" data-institutions-url="{{ '/institutions/' | relative_url }}">
<a class="skip-link" href="#main">Skip to content</a>
{% include nav.html %}
<script src="{{ '/assets/js/routing.js' | relative_url }}"></script>
<main id="main" tabindex="-1">{{ content }}</main>
{% include footer.html %}
{% if page.signal %}{% include haus-signal.html %}{% endif %}
</body>
</html>
